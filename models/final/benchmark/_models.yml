  - name: test_fixed_msr_applies_only_above_the_beneficiary_threshold
    model: fct_projected_savings
    description: >
      Pins the one rule the documentation calls the only condition the
      calculation applies: a flat MSR election takes effect from 5,000 assigned
      beneficiaries upward, and below that the variable schedule governs
      regardless of what the ACO elected.

      Nothing else exercises it. The shipped agreement seed carries no `Fixed`
      row, the other unit test passes an empty agreement, and the real
      deliveries default to `Variable` — so `>= 5000` could be rewritten to
      `>= 0` and every other test in this project would still pass.

      Both groups have the same ACO, on the same `Fixed` election at 1.5%, and
      differ only in [S]:

        2000Q1, [S]=4999  -> below the threshold, so the election does not
                             apply: MSR_BASIS_APPLIED = variable, and [U] comes
                             from the 3000-4999 band at 0.050.
        2000Q2, [S]=5000  -> at the threshold, so the election applies:
                             MSR_BASIS_APPLIED = fixed, [U] = 0.015.

      The bands here are flat by design, so [U] is an endpoint rather than an
      interpolation and the two answers are separated by the gate alone rather
      than by arithmetic. They are also chosen so that neither mistake hides:
      dropping the threshold gives the 4999 row 0.015 instead of 0.050, and
      raising it gives the 5000 row 0.039 instead of 0.015. Interpolation
      itself is covered by the other unit test and by the full band sweep.

    given:

      - input: ref('fct_projected_benchmark_by_enrollment_type')
        rows:
          - {ACO_ID: 'TEST-ACO', PERFORMANCE_YEAR: 2000, PERIOD: '2000Q1', QUARTER_NUM: 1, BENCHMARK_SUBMISSION_ID: 'B-SUB', IS_LATEST_BENCHMARK_SUBMISSION: true, QUARTERLY_SUBMISSION_ID: 'Q-SUB-1', ANNUAL_EXPENDITURE_BENCHMARK_YEAR: 1999, ANNUAL_EXPENDITURE_SUBMISSION_ID: 'B-SUB', ACPT_PERFORMANCE_YEAR_LABEL: 'PY1', IS_AGREEMENT_DEFAULTED: false, ENROLLMENT_TYPE: 'esrd',          ENROLLMENT_PROPORTION: 0.1, PROJECTED_UPDATED_BENCHMARK_EXPENDITURE: 1000}
