  - name: test_current_per_type_keeps_latest_calculable_rows_and_divides_by_twelve
    model: fct_projected_benchmark_by_enrollment_type_current
    description: >
      Pins the two predicates and the division. The fixture is one ACO and one
      performance year with three pairings, of which exactly one should
      survive:

        2000Q1 x B-SUB-2  latest, calculable      -> kept, two enrollment rows
        2000Q1 x B-SUB-1  superseded, calculable  -> dropped by the latest flag
        2000Q2 x B-SUB-2  latest, incalculable    -> dropped by IS_CALCULABLE

      Each decoy is load-bearing on its own. The superseded pairing is
      calculable, so only the latest-delivery predicate removes it; the
      incalculable pairing is on the latest delivery, so only the calculable
      predicate removes it. Dropping either `where` clause surfaces an extra
      row, and the superseded row carries an [M] of 2400 whose PMPM would be a
      clean 200 — visible, not a rounding artefact.

      The kept rows carry one clean [M] and one repeating one: 1200 / 12 is
      exactly 100, and 2166.6666666666665 / 12 — Disabled's [M] from the
      per-type test above — is 180.55555555555554 in IEEE 754, not the
      180.5555555555556 a hand calculation would round to.

    given:

      - input: ref('fct_projected_benchmark_by_enrollment_type')
        rows:
          # The latest, calculable pairing: the rows that should come through.
          - {ACO_ID: 'TEST-ACO', PERFORMANCE_YEAR: 2000, PERIOD: '2000Q1', QUARTER_NUM: 1, BENCHMARK_SUBMISSION_ID: 'B-SUB-2', IS_LATEST_BENCHMARK_SUBMISSION: true,  IS_CALCULABLE: true,  QUARTERLY_SUBMISSION_ID: 'Q-SUB-1', ACPT_PERFORMANCE_YEAR_LABEL: 'PY1', IS_AGREEMENT_DEFAULTED: true, ENROLLMENT_TYPE: 'esrd',     PROJECTED_UPDATED_BENCHMARK_EXPENDITURE: 1200}
          - {ACO_ID: 'TEST-ACO', PERFORMANCE_YEAR: 2000, PERIOD: '2000Q1', QUARTER_NUM: 1, BENCHMARK_SUBMISSION_ID: 'B-SUB-2', IS_LATEST_BENCHMARK_SUBMISSION: true,  IS_CALCULABLE: true,  QUARTERLY_SUBMISSION_ID: 'Q-SUB-1', ACPT_PERFORMANCE_YEAR_LABEL: 'PY1', IS_AGREEMENT_DEFAULTED: true, ENROLLMENT_TYPE: 'disabled', PROJECTED_UPDATED_BENCHMARK_EXPENDITURE: 2166.6666666666665}
          # Decoy: the superseded delivery for the same quarter, fully calculable.
          - {ACO_ID: 'TEST-ACO', PERFORMANCE_YEAR: 2000, PERIOD: '2000Q1', QUARTER_NUM: 1, BENCHMARK_SUBMISSION_ID: 'B-SUB-1', IS_LATEST_BENCHMARK_SUBMISSION: false, IS_CALCULABLE: true,  QUARTERLY_SUBMISSION_ID: 'Q-SUB-1', ACPT_PERFORMANCE_YEAR_LABEL: 'PY1', IS_AGREEMENT_DEFAULTED: true, ENROLLMENT_TYPE: 'esrd',     PROJECTED_UPDATED_BENCHMARK_EXPENDITURE: 2400}
