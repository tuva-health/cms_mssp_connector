          - {ACO_ID: 'TEST-ACO', PERFORMANCE_YEAR: 2000, PERIOD: '2000Q1', QUARTER_NUM: 1, BENCHMARK_SUBMISSION_ID: 'B-SUB', IS_LATEST_BENCHMARK_SUBMISSION: true, QUARTERLY_SUBMISSION_ID: 'Q-SUB-1', ANNUAL_EXPENDITURE_BENCHMARK_YEAR: 1999, ANNUAL_EXPENDITURE_SUBMISSION_ID: 'B-SUB', ACPT_PERFORMANCE_YEAR_LABEL: 'PY1', IS_AGREEMENT_DEFAULTED: false, ENROLLMENT_TYPE: 'aged_non_dual', ENROLLMENT_PROPORTION: 0.4, PROJECTED_UPDATED_BENCHMARK_EXPENDITURE: 4000}
