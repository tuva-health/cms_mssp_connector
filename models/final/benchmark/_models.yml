  - name: test_current_savings_keeps_latest_calculable_rows_and_divides_by_twelve
    model: fct_projected_savings_current
    description: >
      The ACO-level counterpart of the test above, with the same three-way
      fixture shape and one more kept row at realistic magnitude.

        2000Q1 x B-SUB-2  latest, calculable      -> kept
        2000Q1 x B-SUB-1  superseded, calculable  -> dropped by the latest flag
        2000Q2 x B-SUB-2  latest, incalculable    -> dropped by IS_CALCULABLE
        2000Q3 x B-SUB-2  latest, calculable      -> kept

      The incalculable pairing carries a [Q] even though it has no [P], which
      is what the real March preliminary rows look like: the quarterly side is
      complete and only the benchmark side is missing. A model that filtered
      on the benchmark being present but not on IS_CALCULABLE would agree with
      this test; one that dropped the calculable predicate altogether would
      surface a row with an expenditure PMPM and no benchmark PMPM, and fail.

      2000Q3 uses figures of the size the real facts carry — an annual
      benchmark near 25,000 and expenditure near 22,000 — so the PMPMs land
      where a reader expects them, near 2,000, and both quotients are
      repeating: 25000 / 12 is 2083.3333333333335 and 22000 / 12 is
      1833.3333333333333, each the exact double rather than a rounding.

    given:

      - input: ref('fct_projected_savings')
        rows:
          - {ACO_ID: 'TEST-ACO', PERFORMANCE_YEAR: 2000, PERIOD: '2000Q1', QUARTER_NUM: 1, BENCHMARK_SUBMISSION_ID: 'B-SUB-2', IS_LATEST_BENCHMARK_SUBMISSION: true,  IS_CALCULABLE: true,  QUARTERLY_SUBMISSION_ID: 'Q-SUB-1', MSR_TYPE: 'Variable', ACPT_PERFORMANCE_YEAR_LABEL: 'PY1', IS_AGREEMENT_DEFAULTED: true, MEAN_PROJECTED_UPDATED_BENCHMARK: 3000,  ACO_EXPENDITURE_PER_CAPITA: 2700}
          # Decoy: the superseded delivery for the same quarter, fully calculable.
          - {ACO_ID: 'TEST-ACO', PERFORMANCE_YEAR: 2000, PERIOD: '2000Q1', QUARTER_NUM: 1, BENCHMARK_SUBMISSION_ID: 'B-SUB-1', IS_LATEST_BENCHMARK_SUBMISSION: false, IS_CALCULABLE: true,  QUARTERLY_SUBMISSION_ID: 'Q-SUB-1', MSR_TYPE: 'Variable', ACPT_PERFORMANCE_YEAR_LABEL: 'PY1', IS_AGREEMENT_DEFAULTED: true, MEAN_PROJECTED_UPDATED_BENCHMARK: 2400,  ACO_EXPENDITURE_PER_CAPITA: 2700}
          # Decoy: the latest delivery for a quarter it could not compute. [Q] is present, [P] is not.
          - {ACO_ID: 'TEST-ACO', PERFORMANCE_YEAR: 2000, PERIOD: '2000Q2', QUARTER_NUM: 2, BENCHMARK_SUBMISSION_ID: 'B-SUB-2', IS_LATEST_BENCHMARK_SUBMISSION: true,  IS_CALCULABLE: false, QUARTERLY_SUBMISSION_ID: 'Q-SUB-2', MSR_TYPE: 'Variable', ACPT_PERFORMANCE_YEAR_LABEL: 'PY1', IS_AGREEMENT_DEFAULTED: true, MEAN_PROJECTED_UPDATED_BENCHMARK: null,  ACO_EXPENDITURE_PER_CAPITA: 2700}
          - {ACO_ID: 'TEST-ACO', PERFORMANCE_YEAR: 2000, PERIOD: '2000Q3', QUARTER_NUM: 3, BENCHMARK_SUBMISSION_ID: 'B-SUB-2', IS_LATEST_BENCHMARK_SUBMISSION: true,  IS_CALCULABLE: true,  QUARTERLY_SUBMISSION_ID: 'Q-SUB-3', MSR_TYPE: 'Variable', ACPT_PERFORMANCE_YEAR_LABEL: 'PY1', IS_AGREEMENT_DEFAULTED: true, MEAN_PROJECTED_UPDATED_BENCHMARK: 25000, ACO_EXPENDITURE_PER_CAPITA: 22000}

    expect:
      rows:
        - PERIOD: '2000Q1'
          BENCHMARK_SUBMISSION_ID: 'B-SUB-2'
          QUARTERLY_SUBMISSION_ID: 'Q-SUB-1'
          MEAN_PROJECTED_UPDATED_BENCHMARK: 3000.0
          MEAN_PROJECTED_UPDATED_BENCHMARK_PMPM: 250.0
          ACO_EXPENDITURE_PER_CAPITA: 2700
          ACO_EXPENDITURE_PER_CAPITA_PMPM: 225.0
          IS_AGREEMENT_DEFAULTED: true
        - PERIOD: '2000Q3'
          BENCHMARK_SUBMISSION_ID: 'B-SUB-2'
          QUARTERLY_SUBMISSION_ID: 'Q-SUB-3'
          MEAN_PROJECTED_UPDATED_BENCHMARK: 25000.0
          MEAN_PROJECTED_UPDATED_BENCHMARK_PMPM: 2083.3333333333335
          ACO_EXPENDITURE_PER_CAPITA: 22000
