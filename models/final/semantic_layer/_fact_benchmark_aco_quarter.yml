version: 2

# The ACO-quarter benchmark fact.
#
# fact_member_month_benchmark answers the member-level question. This fact
# answers the ACO-level one a dashboard opens with: for each ACO, performance
# year and reported quarter on the latest calculable delivery, what is the
# projected benchmark and expenditure per member per month, is the ACO saving,
# and what risk adjustment would CMS apply at reconciliation — the aggregate
# PY-to-BY3 risk ratio, the cap on it, and the risk-adjusted benchmark.
#
# Regulatory basis, checked against the sources for TUVA-76:
#
#   42 CFR 425.605(a)(1)(ii) (agreement periods beginning on or after
#   1 January 2024), as added by the CY 2023 PFS final rule, 87 FR 69404
#   (18 Nov 2022), regulatory text at 87 FR 70238:
#
#     (A) "Positive adjustments in prospective HCC risk scores are subject to
#         a cap equal to the ACO's aggregate growth in demographic risk scores
#         between BY3 and the performance year (positive or negative) plus 3
#         percentage points."
#     (B) the cap applies "only if the ACO's aggregate growth in prospective
#         HCC risk scores between BY3 and the performance year across all of
#         the populations ... exceeds this cap", and then "the value of the
#         cap is the maximum increase in risk scores for the applicable
#         performance year ... for any of the populations".
#     (C) the aggregate growth "is calculated by taking a weighted average of
#         the growth ... across the populations", where "the weight applied to
#         the growth in risk scores (expressed as a ratio of the ACO's
#         performance year risk score to the ACO's BY3 risk score) for each
#         Medicare enrollment type is equal to the product of the historical
#         benchmark expenditures for that enrollment type and the performance
#         year person years for that enrollment type."
#
#   Preamble: policy and worked steps at 87 FR 69934-69946 (proposal and the
#   seven-step application at 69934-69935; weights finalised, and the term
#   "dollar-weighted" dropped, at 69946). On a floor: at 87 FR 69942 CMS
#   "decline[d] to consider an approach that would limit the impact of
#   prospective HCC risk score decreases at this time", citing favourable
#   risk selection (83 FR 68011).
#
# What that settles, and where this model departs from it deliberately:
#
#   Weighting     Follows (C): w_t = PERSON_YEARS_t x
#                 HISTORICAL_BENCHMARK_EXPENDITURE_t. The ticket's draft used
#                 the projected updated benchmark [M]; the regulation names
#                 the historical benchmark, and [M] is that figure times the
#                 update factor, so the two differ by type. The source wins.
#   Upper bound   The regulation's cap is demographic growth plus 3 points.
#                 The BY3 demographic scores are not in the workbook, so the
#                 default is the flat cap 1 + `mssp_risk_score_cap` and the
#                 growth term is offered only as the labelled scenario below,
#                 proxied by the Table 4 national mean's own trend — a
#                 different quantity, used because it is the only score trend
#                 the delivery carries.
#   Lower bound   Not in the regulation, and a floor was declined at 69942.
#                 CAP_LOWER_BOUND = 1 - cap is this project's symmetric
#                 convention, carried from the ticket; a consumer who wants
#                 the regulatory behaviour reads CAP_FACTOR only where
#                 AGGREGATE_RISK_RATIO > CAP_UPPER_BOUND.
#   Application   (B) and the steps at 69935 clip each type's ratio to the
#                 cap value when the aggregate exceeds it. This model instead
#                 rescales every type — and through fact_member_month_benchmark
#                 every member — by the one factor bound / R, so the aggregate
#                 lands on the bound and relative risk between members is kept.
#                 The two agree when every type is on the same side of the
#                 bound and differ otherwise.
#
# Every figure is NULL-safe and nothing is defaulted: a type without assigned,
# scored member-months makes the aggregate, the factor and the capped
# benchmark NULL for the year. The rates and ratios go through to_double and
# safe_divide like everything else in the project.

models:

  - name: fact_benchmark_aco_quarter
    description: >
      One row per ACO, performance year and reported quarter on the latest
      calculable benchmark delivery — the grain of
      `fct_projected_savings_current` — carrying the projected savings verdict
      per member per month and the risk adjustment block: the PY-to-BY3 risk
      ratio per enrollment type, their aggregate, the cap bounds and factor,
      the risk-adjusted ACO benchmark, and a national-growth scenario for the
      cap.

      The quarter that serves `fact_member_month_benchmark` for the year — the
      highest `QUARTER_NUM`, lowest `ACO_ID` on ties — is flagged
      `IS_CURRENT_PROJECTION`; the other quarters of the year are carried with
      their own risk block so a report can show the cap moving with each
      quarterly delivery. The per-type ratios are a property of the year (the
      assignment-list means over the whole calendar year against BY3 `[C]` of
      the year's benchmark delivery); the weights, proportions and `[M]` are
      the quarter row's own.

      The cap percentage is the project variable `mssp_risk_score_cap`,
      default `0.03`. Swapping in a factor CMS publishes is a variable change.

    config:
      schema: semantic_layer

    columns:
      - name: ACO_ID
        description: CMS-assigned ACO identifier of the projection.
        data_tests:
          - not_null

      - name: PERFORMANCE_YEAR
        description: The performance year the projection is for.
        data_tests:
          - not_null

      - name: PERIOD
        description: The reported quarter, `<YYYY>Q<N>`.
        data_tests:
          - not_null

      - name: QUARTER_NUM
        description: Quarter number 1-4 of `PERIOD`.
        data_tests:
          - not_null

      - name: IS_CURRENT_PROJECTION
        description: >
          True on the one row per performance year that
          `fact_member_month_benchmark` reads its rates and its cap factor
          from: the highest quarter of the year, lowest `ACO_ID` on ties.
          `assert_aco_quarter_projection_agrees_with_member_fact` holds the
          two models to the same choice.
        data_tests:
          - not_null

      - name: BENCHMARK_SUBMISSION_ID
        description: >
          The benchmark delivery the projection, the BY3 scores, the Table 4
          national means and the BY3 calendar year were all read from.
        data_tests:
          - not_null

      - name: QUARTERLY_SUBMISSION_ID
        description: Delivery stamp of the QEXPU workbook behind the quarter.

      - name: MEAN_PROJECTED_UPDATED_BENCHMARK
        description: "`[P]`, the ACO mean projected updated benchmark, annual per capita."

      - name: MEAN_PROJECTED_UPDATED_BENCHMARK_PMPM
        description: "`[P] / 12`, the benchmark per member per month."

      - name: ACO_EXPENDITURE_PER_CAPITA
        description: "`[Q]`, the ACO's annualised per capita expenditure for the quarter."

      - name: ACO_EXPENDITURE_PER_CAPITA_PMPM
        description: "`[Q] / 12`, the expenditure per member per month."

      - name: PROJECTED_SAVINGS_PERCENTAGE
        description: "`[R]`, the projected savings as a fraction of the benchmark."

      - name: ASSIGNED_BENEFICIARIES
        description: Assigned beneficiaries the quarterly report counted.

      - name: MSR_TYPE
        description: Carried from the projection; see `fct_projected_savings`.

      - name: FIXED_MSR_RATE
        description: Carried from the projection; see `fct_projected_savings`.

      - name: ACO_TRACK
        description: Carried from the projection; see `fct_projected_savings`.

      - name: MSR_BASIS_APPLIED
        description: Carried from the projection; see `fct_projected_savings`.

      - name: ESTIMATED_MSR
        description: The estimated minimum savings rate; see `fct_projected_savings`.

      - name: EXPENDITURES_BELOW_BENCHMARK
        description: Carried from the projection; see `fct_projected_savings`.

      - name: SAVINGS_EXCEEDS_MSR
        description: Carried from the projection; see `fct_projected_savings`.

      - name: SAVINGS_STATUS
        description: The savings verdict; see `fct_projected_savings`.

      - name: BY3_CALENDAR_YEAR
        description: >
          The calendar year of benchmark year 3, read from the delivery's
          parameters sheet: the `Benchmark Year 3 (BY3)` row of the
          `Expenditure & Risk Score Period` group, whose value is a date
          range such as `01/01/2024 - 12/31/2024`; the last four characters
          are the year. The number of years the national growth scenario
          compounds over is `PERFORMANCE_YEAR - BY3_CALENDAR_YEAR`. NULL where
          the sheet carries no such row, which also makes the scenario NULL.

      - name: ASSIGNED_SCORED_MEMBER_MONTHS_ESRD
        description: >
          Assigned member-months of the performance year with a CMS
          prospective HCC score and this enrollment type, from
          `int_member_month_risk` — the population the type's PY mean is
          taken over. NULL where there are none.

      - name: PY_MEAN_RISK_SCORE_ESRD
        description: >
          Mean assignment-list score over those member-months, on the
          national-mean-of-1.0 basis. NULL where there are none.

      - name: BY3_RISK_SCORE_ESRD
        description: >
          `[C]` at BY3 for the type, from `int_benchmark_risk_scores` on the
          projection's benchmark submission.

      - name: RISK_RATIO_ESRD
        description: >
          `PY_MEAN_RISK_SCORE / BY3_RISK_SCORE` through `safe_divide`: the
          type's PY-to-BY3 prospective HCC risk ratio, uncapped. NULL where
          either side is missing.

      - name: RISK_RATIO_WEIGHT_ESRD
        description: >
          The type's share of the aggregate: `PERSON_YEARS x
          HISTORICAL_BENCHMARK_EXPENDITURE` for the type over the sum across
          the quarter's types, per 42 CFR 425.605(a)(1)(ii)(C).

      - name: ASSIGNED_SCORED_MEMBER_MONTHS_DISABLED
        description: As for ESRD, for the disabled enrollment type.
      - name: PY_MEAN_RISK_SCORE_DISABLED
        description: As for ESRD, for the disabled enrollment type.
      - name: BY3_RISK_SCORE_DISABLED
        description: As for ESRD, for the disabled enrollment type.
      - name: RISK_RATIO_DISABLED
        description: As for ESRD, for the disabled enrollment type.
      - name: RISK_RATIO_WEIGHT_DISABLED
        description: As for ESRD, for the disabled enrollment type.

      - name: ASSIGNED_SCORED_MEMBER_MONTHS_AGED_DUAL
        description: As for ESRD, for the aged/dual enrollment type.
      - name: PY_MEAN_RISK_SCORE_AGED_DUAL
        description: As for ESRD, for the aged/dual enrollment type.
      - name: BY3_RISK_SCORE_AGED_DUAL
        description: As for ESRD, for the aged/dual enrollment type.
      - name: RISK_RATIO_AGED_DUAL
        description: As for ESRD, for the aged/dual enrollment type.
      - name: RISK_RATIO_WEIGHT_AGED_DUAL
        description: As for ESRD, for the aged/dual enrollment type.

      - name: ASSIGNED_SCORED_MEMBER_MONTHS_AGED_NON_DUAL
        description: As for ESRD, for the aged/non-dual enrollment type.
      - name: PY_MEAN_RISK_SCORE_AGED_NON_DUAL
        description: As for ESRD, for the aged/non-dual enrollment type.
      - name: BY3_RISK_SCORE_AGED_NON_DUAL
        description: As for ESRD, for the aged/non-dual enrollment type.
      - name: RISK_RATIO_AGED_NON_DUAL
        description: As for ESRD, for the aged/non-dual enrollment type.
      - name: RISK_RATIO_WEIGHT_AGED_NON_DUAL
        description: As for ESRD, for the aged/non-dual enrollment type.

      - name: AGGREGATE_RISK_RATIO
        description: >
          `R`, the weighted mean of the per-type ratios with the weights
          above — the ACO's aggregate growth in prospective HCC risk scores
          between BY3 and the performance year, in the sense of 42 CFR
          425.605(a)(1)(ii)(B) and (C). NULL as soon as any enrollment type
          of the quarter lacks a ratio or a weight; a missing type is never
          treated as unchanged.

      - name: RISK_SCORE_CAP
        description: >
          The cap percentage applied, the value of `mssp_risk_score_cap`
          (default `0.03`, the regulation's 3 percentage points). Carried so
          a row records what it was computed under.
        data_tests:
          - not_null

      - name: CAP_UPPER_BOUND
        description: >
          `1 + RISK_SCORE_CAP`. The flat cap: the regulation's 3 points
          without the demographic growth term it adds, which the delivery
          does not carry.
        data_tests:
          - not_null

      - name: CAP_LOWER_BOUND
        description: >
          `1 - RISK_SCORE_CAP`. A symmetric floor carried as a project
          convention; the regulation caps positive adjustments only, and CMS
          declined a floor at 87 FR 69942. The header of this file records
          the choice.
        data_tests:
          - not_null

      - name: CAP_FACTOR
        description: >
          `c`: `CAP_UPPER_BOUND / R` where `R` is above the upper bound,
          `CAP_LOWER_BOUND / R` where below, otherwise exactly 1. The one
          number every type's ratio — and every member's risk-adjusted rate
          in `fact_member_month_benchmark` — is multiplied by, so the capped
          aggregate lands on the bound. NULL where `R` is NULL.

      - name: IS_CAP_BINDING
        description: >
          True where `R` lies outside the bounds and `CAP_FACTOR` is not 1.
          NULL where `R` is NULL, which the test below lets through: a NULL
          comparison is neither true nor false.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "= (CAP_FACTOR <> 1)"

      - name: RISK_ADJUSTED_BENCHMARK_UNCAPPED
        description: >
          `sum over types of ENROLLMENT_PROPORTION x [M] x RISK_RATIO`: the
          projected updated benchmark risk-adjusted by the uncapped ratios,
          annual per capita. NULL where any type lacks an input.

      - name: RISK_ADJUSTED_BENCHMARK
        description: >
          `RISK_ADJUSTED_BENCHMARK_UNCAPPED x CAP_FACTOR` — the risk-adjusted
          ACO benchmark under the flat cap, annual per capita. NULL where
          either is NULL.

      - name: RISK_ADJUSTED_BENCHMARK_PMPM
        description: >
          `RISK_ADJUSTED_BENCHMARK / 12`. Applied to the member fact's mix of
          assigned, scored member-months by type, the capped member rates sum
          to exactly this figure;
          `assert_capped_member_rate_reconciles_to_aco_benchmark` says so.

      - name: NATIONAL_GROWTH_PROJECTED
        description: >
          Scenario input, a projection and not a CMS figure: for each type,
          the BNMRK Table 4 national mean risk score's BY1-to-BY3 growth
          annualised over the two years and compounded from
          `BY3_CALENDAR_YEAR` to `PERFORMANCE_YEAR` — `(BY3 / BY1) ^ ((PY -
          BY3 year) / 2)` — aggregated with the same weights as `R`. Stands in
          for the growth term of 42 CFR 425.605(a)(1)(ii)(A), which is the
          ACO's own demographic score growth and is not in the delivery. NULL
          on a delivery without Table 4 (the preliminary March workbook) or
          without the BY3 calendar year.

      - name: CAP_UPPER_BOUND_SCENARIO
        description: >
          `1 + RISK_SCORE_CAP + NATIONAL_GROWTH_PROJECTED - 1`, the cap with
          the projected growth term added. Informational; the flat
          `CAP_UPPER_BOUND` is the default.

      - name: CAP_FACTOR_SCENARIO
        description: >
          `CAP_FACTOR` recomputed against `CAP_UPPER_BOUND_SCENARIO` (the
          lower bound unchanged). NULL where `R` or the scenario bound is NULL.

      - name: IS_CAP_BINDING_SCENARIO
        description: >
          True where `R` lies outside the scenario bounds. NULL where either
          is NULL.

      - name: ANNUAL_EXPENDITURE_BENCHMARK_YEAR
        description: Carried from the projection; see `fct_projected_savings`.

      - name: ANNUAL_EXPENDITURE_SUBMISSION_ID
        description: Carried from the projection; see `fct_projected_savings`.

      - name: ACPT_PERFORMANCE_YEAR_LABEL
        description: Carried from the projection; see `fct_projected_savings`.

      - name: IS_AGREEMENT_DEFAULTED
        description: >
          Carried from the projection: true where the ACO's agreement row was
          missing and the prospective trend was defaulted, so `[M]`, `[P]`
          and every figure here rest on a guess.

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - ACO_ID
              - PERFORMANCE_YEAR
              - PERIOD
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              (CAP_FACTOR is null) = (AGGREGATE_RISK_RATIO is null)
              and (RISK_ADJUSTED_BENCHMARK is null or CAP_FACTOR is not null)

# ---------------------------------------------------------------------------
# Unit test
#
# One performance year per cap case, each with its own delivery, so that a
# ratio or a bound read from the wrong year would show. The weights are
# chosen so every aggregate is an exact binary fraction and the expected
# doubles are the IEEE results of the same operations in the same order.
# ---------------------------------------------------------------------------

unit_tests:

  - name: test_aggregate_ratio_cap_and_scenario
    model: fact_benchmark_aco_quarter
    description: >
      2025 Q4  Four types. Ratios 1.25, 0.75, 1.0, 1.5 (the ESRD mean 3.0
               over [C] 2.0) with weights 2, 4, 1, 1 from person years x
               historical benchmark — R exactly 1.0, inside the bounds, factor
               1, benchmark 40500 uncapped and capped. BY3 is 2025 itself, so
               the projected growth is 1 and the scenario bound is 1.03.
      2026 Q1  Not the current projection; weights 3 and 1 on ratios 1.5 and
               1.0 give R 1.375, above 1.03: factor 1.03 / 1.375. Growth
               (1.21 x 3 + 1.0) / 4 over the two years from BY3 2024.
      2026 Q2  Current. Equal weights, R 1.25, factor 1.03 / 1.25 = 0.824,
               benchmark 42000 -> 34608, PMPM 2884. Growth 1.105, scenario
               bound 1.135, scenario factor 0.908. The BY3 aged/dual [C]
               must come from B26 on the latest file, not the B26-OTHER
               delivery (9.9), the older B26 file (7.0) or BY2 (5.0).
      2027 Q4  R 0.75, below 0.97: factor 0.97 / 0.75. One year from BY3
               2026, so growth is the square root: (2.25 ^ 0.5 + 1) / 2 =
               1.25, and the scenario factor is the lower-bound one.
      2028 Q4  Disabled has an assigned member-month without a score and no
               other: its ratio is NULL, so R, the factor, the flags and the
               benchmarks are NULL while aged/dual's own ratio and weight
               are still reported. No parameters row, so BY3 year is NULL.
      2029 Q1  No enrollment-type rows at all: savings columns carried, the
               whole risk block NULL.
      Member-month decoys in 2025: an assigned aged/dual month without a
      score, an unassigned one with a score of 9.0, and a scored month with
      no enrollment type, none of which may enter a mean.

    given:

      - input: ref('fct_projected_savings_current')
        rows:
          - {ACO_ID: 'A1', PERFORMANCE_YEAR: 2025, PERIOD: '2025Q4', QUARTER_NUM: 4, BENCHMARK_SUBMISSION_ID: 'B25', QUARTERLY_SUBMISSION_ID: 'Q25-4', MEAN_PROJECTED_UPDATED_BENCHMARK_PMPM: 2000, ACO_EXPENDITURE_PER_CAPITA_PMPM: 1900, SAVINGS_STATUS: 'savings', IS_AGREEMENT_DEFAULTED: false}
          - {ACO_ID: 'A1', PERFORMANCE_YEAR: 2026, PERIOD: '2026Q1', QUARTER_NUM: 1, BENCHMARK_SUBMISSION_ID: 'B26', QUARTERLY_SUBMISSION_ID: 'Q26-1', MEAN_PROJECTED_UPDATED_BENCHMARK_PMPM: 1000, IS_AGREEMENT_DEFAULTED: false}
          - {ACO_ID: 'A1', PERFORMANCE_YEAR: 2026, PERIOD: '2026Q2', QUARTER_NUM: 2, BENCHMARK_SUBMISSION_ID: 'B26', QUARTERLY_SUBMISSION_ID: 'Q26-2', MEAN_PROJECTED_UPDATED_BENCHMARK_PMPM: 2000, IS_AGREEMENT_DEFAULTED: false}
          - {ACO_ID: 'A1', PERFORMANCE_YEAR: 2027, PERIOD: '2027Q4', QUARTER_NUM: 4, BENCHMARK_SUBMISSION_ID: 'B27', QUARTERLY_SUBMISSION_ID: 'Q27-4', MEAN_PROJECTED_UPDATED_BENCHMARK_PMPM: 1500, IS_AGREEMENT_DEFAULTED: true}
          - {ACO_ID: 'A1', PERFORMANCE_YEAR: 2028, PERIOD: '2028Q4', QUARTER_NUM: 4, BENCHMARK_SUBMISSION_ID: 'B28', QUARTERLY_SUBMISSION_ID: 'Q28-4', MEAN_PROJECTED_UPDATED_BENCHMARK_PMPM: 1600, IS_AGREEMENT_DEFAULTED: false}
          - {ACO_ID: 'A1', PERFORMANCE_YEAR: 2029, PERIOD: '2029Q1', QUARTER_NUM: 1, BENCHMARK_SUBMISSION_ID: 'B29', QUARTERLY_SUBMISSION_ID: 'Q29-1', MEAN_PROJECTED_UPDATED_BENCHMARK_PMPM: 1700, IS_AGREEMENT_DEFAULTED: false}

      - input: ref('fct_projected_benchmark_by_enrollment_type_current')
        rows:
          - {ACO_ID: 'A1', PERFORMANCE_YEAR: 2025, PERIOD: '2025Q4', QUARTER_NUM: 4, BENCHMARK_SUBMISSION_ID: 'B25', ENROLLMENT_TYPE: 'aged_dual',     PROJECTED_UPDATED_BENCHMARK_EXPENDITURE: 48000, HISTORICAL_BENCHMARK_EXPENDITURE: 1, PERSON_YEARS: 2,   ENROLLMENT_PROPORTION: 0.25}
          - {ACO_ID: 'A1', PERFORMANCE_YEAR: 2025, PERIOD: '2025Q4', QUARTER_NUM: 4, BENCHMARK_SUBMISSION_ID: 'B25', ENROLLMENT_TYPE: 'aged_non_dual', PROJECTED_UPDATED_BENCHMARK_EXPENDITURE: 12000, HISTORICAL_BENCHMARK_EXPENDITURE: 2, PERSON_YEARS: 2,   ENROLLMENT_PROPORTION: 0.5}
          - {ACO_ID: 'A1', PERFORMANCE_YEAR: 2025, PERIOD: '2025Q4', QUARTER_NUM: 4, BENCHMARK_SUBMISSION_ID: 'B25', ENROLLMENT_TYPE: 'disabled',      PROJECTED_UPDATED_BENCHMARK_EXPENDITURE: 24000, HISTORICAL_BENCHMARK_EXPENDITURE: 1, PERSON_YEARS: 1,   ENROLLMENT_PROPORTION: 0.125}
          - {ACO_ID: 'A1', PERFORMANCE_YEAR: 2025, PERIOD: '2025Q4', QUARTER_NUM: 4, BENCHMARK_SUBMISSION_ID: 'B25', ENROLLMENT_TYPE: 'esrd',          PROJECTED_UPDATED_BENCHMARK_EXPENDITURE: 96000, HISTORICAL_BENCHMARK_EXPENDITURE: 2, PERSON_YEARS: 0.5, ENROLLMENT_PROPORTION: 0.125}
          - {ACO_ID: 'A1', PERFORMANCE_YEAR: 2026, PERIOD: '2026Q1', QUARTER_NUM: 1, BENCHMARK_SUBMISSION_ID: 'B26', ENROLLMENT_TYPE: 'aged_dual',     PROJECTED_UPDATED_BENCHMARK_EXPENDITURE: 40000, HISTORICAL_BENCHMARK_EXPENDITURE: 3, PERSON_YEARS: 1,   ENROLLMENT_PROPORTION: 0.75}
          - {ACO_ID: 'A1', PERFORMANCE_YEAR: 2026, PERIOD: '2026Q1', QUARTER_NUM: 1, BENCHMARK_SUBMISSION_ID: 'B26', ENROLLMENT_TYPE: 'aged_non_dual', PROJECTED_UPDATED_BENCHMARK_EXPENDITURE: 8000,  HISTORICAL_BENCHMARK_EXPENDITURE: 1, PERSON_YEARS: 1,   ENROLLMENT_PROPORTION: 0.25}
          - {ACO_ID: 'A1', PERFORMANCE_YEAR: 2026, PERIOD: '2026Q2', QUARTER_NUM: 2, BENCHMARK_SUBMISSION_ID: 'B26', ENROLLMENT_TYPE: 'aged_dual',     PROJECTED_UPDATED_BENCHMARK_EXPENDITURE: 48000, HISTORICAL_BENCHMARK_EXPENDITURE: 1, PERSON_YEARS: 1,   ENROLLMENT_PROPORTION: 0.5}
          - {ACO_ID: 'A1', PERFORMANCE_YEAR: 2026, PERIOD: '2026Q2', QUARTER_NUM: 2, BENCHMARK_SUBMISSION_ID: 'B26', ENROLLMENT_TYPE: 'aged_non_dual', PROJECTED_UPDATED_BENCHMARK_EXPENDITURE: 12000, HISTORICAL_BENCHMARK_EXPENDITURE: 1, PERSON_YEARS: 1,   ENROLLMENT_PROPORTION: 0.5}
          - {ACO_ID: 'A1', PERFORMANCE_YEAR: 2027, PERIOD: '2027Q4', QUARTER_NUM: 4, BENCHMARK_SUBMISSION_ID: 'B27', ENROLLMENT_TYPE: 'aged_dual',     PROJECTED_UPDATED_BENCHMARK_EXPENDITURE: 24000, HISTORICAL_BENCHMARK_EXPENDITURE: 1, PERSON_YEARS: 1,   ENROLLMENT_PROPORTION: 0.5}
