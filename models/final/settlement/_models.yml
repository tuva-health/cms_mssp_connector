version: 2

# Settlement facts: CMS's final settled result for a performance year, read
# from the settlement (STLMT) workbook, never recomputed.
#
# Column names. A field has a meaningful name only where the settlement
# handoff pins one letter to one meaning; those are "Confirmed name" below:
# UPDATED_BENCHMARK (Table 2 [I]), ASSIGNED_BENEFICIARIES ([A]),
# PERSON_YEARS ([B]), PER_CAPITA_EXPENDITURE ([E]), BENCHMARK_PER_CAPITA
# ([F]) and SAVINGS_REALIZED ([P]). A field the handoff names only as part
# of a range is "Coded name": T2_<code>_<type> and T3_<code>, documented with
# the range's meaning. The list lives in macros/settlement_fields.sql. Rename
# a coded field once a delivered workbook confirms its meaning (TUVA-160,
# TUVA-158).

models:

  - name: fct_settlement
    description: >
      CMS's final settled result, one row per ACO and performance year: the
      settlement workbook's Table 2 (updated benchmark) and Table 3 (shared
      savings and losses), as written.

      When the embargoed and unembargoed deliveries are both present, the
      unembargoed one is read; the two carry the same workbook.

      A low-revenue ACO below its MSR can still share savings, at half the
      rate. Table 3 `[P]` (`SAVINGS_REALIZED`) then reads `N/A` and `[BB]`
      (`T3_BB`) carries the result. Both come through as written; nothing
      here infers "no savings" from savings below the MSR.

      Each field is its row's one real value (not empty, not `-`), whichever
      value column holds it; `assert_settlement_values_are_unambiguous`
      fails on a row with two. A field the workbook leaves `-` is NULL.
      Table A1 is in `fct_settlement_risk`.

    config:
      schema: input_layer

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - ACO_ID
              - PERFORMANCE_YEAR

    columns:
      - name: ACO_ID
        description: >
          CMS-assigned ACO identifier.
        data_tests:
          - not_null

      - name: PERFORMANCE_YEAR
        description: >
          Performance year settled.
        data_tests:
          - not_null

      - name: SUBMISSION_ID
        description: >
          The delivery read: `STLMT.` plus the bundle stamp.
        data_tests:
          - not_null

      - name: IS_EMBARGOED
        description: >
          Whether the delivery read is the embargoed one. FALSE whenever
          an unembargoed copy exists; TRUE only when it is the only copy.

      - name: FILE_DATE
        description: >
          Delivery date from the `D<YYMMDD>` stamp; NULL for a placeholder.

      - name: FILE_PATH
        description: >
          The settlement workbook read.
        data_tests:
          - not_null

      - name: SETTLEMENT_DELIVERY_COUNT
        description: >
          How many copies of this settlement were delivered (1 or 2:
          embargoed and unembargoed). The copies carry the same workbook.
        data_tests:
          - not_null

      - name: UPDATED_BENCHMARK
        description: >
          Confirmed name. Table 2 `[I]`, the updated benchmark.

      - name: T2_A_ESRD
        description: >
          Coded name. Table 2 `[A]`, ESRD: one of the per-enrollment-type
          values `[A]`-`[H]` the updated benchmark is built from.

      - name: T2_A_DISABLED
        description: >
          Coded name. Table 2 `[A]`, disabled: one of the per-enrollment-type
          values `[A]`-`[H]` the updated benchmark is built from.

      - name: T2_A_AGED_DUAL
        description: >
          Coded name. Table 2 `[A]`, aged/dual: one of the per-enrollment-type
          values `[A]`-`[H]` the updated benchmark is built from.

      - name: T2_A_AGED_NON_DUAL
        description: >
          Coded name. Table 2 `[A]`, aged/non-dual: one of the per-enrollment-type
          values `[A]`-`[H]` the updated benchmark is built from.

      - name: T2_B_ESRD
        description: >
          Coded name. Table 2 `[B]`, ESRD: one of the per-enrollment-type
          values `[A]`-`[H]` the updated benchmark is built from.

      - name: T2_B_DISABLED
        description: >
          Coded name. Table 2 `[B]`, disabled: one of the per-enrollment-type
          values `[A]`-`[H]` the updated benchmark is built from.

      - name: T2_B_AGED_DUAL
        description: >
          Coded name. Table 2 `[B]`, aged/dual: one of the per-enrollment-type
