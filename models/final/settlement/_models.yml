          values `[A]`-`[H]` the updated benchmark is built from.

      - name: T2_F_AGED_DUAL
        description: >
          Coded name. Table 2 `[F]`, aged/dual: one of the per-enrollment-type
          values `[A]`-`[H]` the updated benchmark is built from.

      - name: T2_F_AGED_NON_DUAL
        description: >
          Coded name. Table 2 `[F]`, aged/non-dual: one of the per-enrollment-type
