      - name: T2_G_ESRD
        description: >
          Coded name. Table 2 `[G]`, ESRD: one of the per-enrollment-type
          values `[A]`-`[H]` the updated benchmark is built from.

      - name: T2_G_DISABLED
        description: >
          Coded name. Table 2 `[G]`, disabled: one of the per-enrollment-type
