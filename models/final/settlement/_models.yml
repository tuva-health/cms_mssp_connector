  - name: fct_settlement_risk
    description: >
      The settlement workbook's Table A1 (risk adjustment): one row per ACO,
      performance year, section and enrollment type, from the preferred
      delivery, with the BY3 and performance-year values side by side.

      Tall on purpose: Table A1's section codes are not yet checked against a
      delivered workbook, so none is given a meaning. `SECTION_CODE` and
      `SECTION_LABEL` say what a row is (CMS-HCC scores, the ratio, the
      demographic scores, the cap, the capped ratio). Pivot it into named
      columns once the codes are confirmed (TUVA-161, TUVA-162).

    config:
      schema: input_layer

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - ACO_ID
              - PERFORMANCE_YEAR
              - SECTION_CODE
              - ENROLLMENT_TYPE

    columns:
      - name: ACO_ID
        description: CMS-assigned ACO identifier.
        data_tests:
          - not_null

      - name: PERFORMANCE_YEAR
        description: Performance year settled.
        data_tests:
          - not_null

      - name: SUBMISSION_ID
        description: The delivery read, as in `fct_settlement`.
        data_tests:
          - not_null

      - name: IS_EMBARGOED
        description: Whether the delivery read is the embargoed one.

      - name: FILE_PATH
        description: The settlement workbook read.
        data_tests:
          - not_null

      - name: SECTION_CODE
        description: The Table A1 section's `[X]` code, verbatim.
        data_tests:
          - not_null

      - name: SECTION_LABEL
        description: The Table A1 section's heading, verbatim.

      - name: ENROLLMENT_TYPE
        description: >
          `esrd`, `disabled`, `aged_dual` or `aged_non_dual` for a per-type
          row; `total` for the section's own row.
        data_tests:
          - not_null

      - name: BY3_VALUE
        description: The value in the `BY3` column, as a number; NULL for `-` or text.

      - name: BY3_VALUE_TEXT
        description: The `BY3` cell verbatim; NULL for `-`.

      - name: PY_VALUE
        description: The value in the `Performance Year` column, as a number; NULL for `-` or text.

      - name: PY_VALUE_TEXT
        description: The `Performance Year` cell verbatim; NULL for `-`.

unit_tests:

  - name: test_settlement_reads_the_workbook_and_keeps_the_low_revenue_result
    model: fct_settlement
    description: >
      One ACO and performance year, delivered embargoed and unembargoed. The
      embargoed copy carries decoy values, so a wrong pick shows.

      The ACO is low revenue and below its MSR: `[P]` reads `N/A` and `[BB]`
      carries the shared savings. What the expected row pins: `[P]` stays
      the text `N/A`, `[BB]` comes through as its number and is never zero,
      and nothing is derived (`[EE]`, which the workbook leaves `-`, is
      NULL). Also: `[I]` and a Table 2 per-type value are read from the
      column holding the real value, beside a `-` in the other; person
      years come per type; an `unmapped` row never lands in a field; and
      `SETTLEMENT_DELIVERY_COUNT` counts both copies.

    given:

      - input: ref('int_settlement_values')
        rows:
          # Unembargoed, preferred.
          - {ACO_ID: 'TEST-ACO', PERFORMANCE_YEAR: 2000, SUBMISSION_ID: 'STLMT.U', IS_EMBARGOED: false, FILE_PATH: 'u.xlsx', IS_PREFERRED_SUBMISSION: true, TABLE_CODE: '2', SECTION_CODE: 'I',  ENROLLMENT_TYPE: 'total',    COLUMN_LABEL: 'BY3',              VALUE_TEXT: '-',        VALUE_NUMERIC: null,    IS_PLACEHOLDER: true}
          - {ACO_ID: 'TEST-ACO', PERFORMANCE_YEAR: 2000, SUBMISSION_ID: 'STLMT.U', IS_EMBARGOED: false, FILE_PATH: 'u.xlsx', IS_PREFERRED_SUBMISSION: true, TABLE_CODE: '2', SECTION_CODE: 'I',  ENROLLMENT_TYPE: 'total',    COLUMN_LABEL: 'Performance Year', VALUE_TEXT: '1,000.50', VALUE_NUMERIC: 1000.50, IS_PLACEHOLDER: false}
          - {ACO_ID: 'TEST-ACO', PERFORMANCE_YEAR: 2000, SUBMISSION_ID: 'STLMT.U', IS_EMBARGOED: false, FILE_PATH: 'u.xlsx', IS_PREFERRED_SUBMISSION: true, TABLE_CODE: '2', SECTION_CODE: 'H',  ENROLLMENT_TYPE: 'esrd',     COLUMN_LABEL: 'BY3',              VALUE_TEXT: '-',        VALUE_NUMERIC: null,    IS_PLACEHOLDER: true}
          - {ACO_ID: 'TEST-ACO', PERFORMANCE_YEAR: 2000, SUBMISSION_ID: 'STLMT.U', IS_EMBARGOED: false, FILE_PATH: 'u.xlsx', IS_PREFERRED_SUBMISSION: true, TABLE_CODE: '2', SECTION_CODE: 'H',  ENROLLMENT_TYPE: 'esrd',     COLUMN_LABEL: 'Performance Year', VALUE_TEXT: '900',      VALUE_NUMERIC: 900,     IS_PLACEHOLDER: false}
          - {ACO_ID: 'TEST-ACO', PERFORMANCE_YEAR: 2000, SUBMISSION_ID: 'STLMT.U', IS_EMBARGOED: false, FILE_PATH: 'u.xlsx', IS_PREFERRED_SUBMISSION: true, TABLE_CODE: '2', SECTION_CODE: 'H',  ENROLLMENT_TYPE: 'unmapped', COLUMN_LABEL: 'Performance Year', VALUE_TEXT: '7',        VALUE_NUMERIC: 7,       IS_PLACEHOLDER: false}
          - {ACO_ID: 'TEST-ACO', PERFORMANCE_YEAR: 2000, SUBMISSION_ID: 'STLMT.U', IS_EMBARGOED: false, FILE_PATH: 'u.xlsx', IS_PREFERRED_SUBMISSION: true, TABLE_CODE: '3', SECTION_CODE: 'A',  ENROLLMENT_TYPE: 'total',    COLUMN_LABEL: 'Performance Year', VALUE_TEXT: '1000',     VALUE_NUMERIC: 1000,    IS_PLACEHOLDER: false}
          - {ACO_ID: 'TEST-ACO', PERFORMANCE_YEAR: 2000, SUBMISSION_ID: 'STLMT.U', IS_EMBARGOED: false, FILE_PATH: 'u.xlsx', IS_PREFERRED_SUBMISSION: true, TABLE_CODE: '3', SECTION_CODE: 'B',  ENROLLMENT_TYPE: 'disabled', COLUMN_LABEL: 'Performance Year', VALUE_TEXT: '250',      VALUE_NUMERIC: 250,     IS_PLACEHOLDER: false}
          # Below the MSR, low revenue: [P] is N/A and [BB] carries the result.
          - {ACO_ID: 'TEST-ACO', PERFORMANCE_YEAR: 2000, SUBMISSION_ID: 'STLMT.U', IS_EMBARGOED: false, FILE_PATH: 'u.xlsx', IS_PREFERRED_SUBMISSION: true, TABLE_CODE: '3', SECTION_CODE: 'P',  ENROLLMENT_TYPE: 'total',    COLUMN_LABEL: 'Result',           VALUE_TEXT: 'N/A',      VALUE_NUMERIC: null,    IS_PLACEHOLDER: false}
          - {ACO_ID: 'TEST-ACO', PERFORMANCE_YEAR: 2000, SUBMISSION_ID: 'STLMT.U', IS_EMBARGOED: false, FILE_PATH: 'u.xlsx', IS_PREFERRED_SUBMISSION: true, TABLE_CODE: '3', SECTION_CODE: 'BB', ENROLLMENT_TYPE: 'total',    COLUMN_LABEL: 'Result',           VALUE_TEXT: '5,432',    VALUE_NUMERIC: 5432,    IS_PLACEHOLDER: false}
          - {ACO_ID: 'TEST-ACO', PERFORMANCE_YEAR: 2000, SUBMISSION_ID: 'STLMT.U', IS_EMBARGOED: false, FILE_PATH: 'u.xlsx', IS_PREFERRED_SUBMISSION: true, TABLE_CODE: '3', SECTION_CODE: 'EE', ENROLLMENT_TYPE: 'total',    COLUMN_LABEL: 'Result',           VALUE_TEXT: '-',        VALUE_NUMERIC: null,    IS_PLACEHOLDER: true}
          - {ACO_ID: 'TEST-ACO', PERFORMANCE_YEAR: 2000, SUBMISSION_ID: 'STLMT.U', IS_EMBARGOED: false, FILE_PATH: 'u.xlsx', IS_PREFERRED_SUBMISSION: true, TABLE_CODE: '3', SECTION_CODE: 'MM', ENROLLMENT_TYPE: 'total',    COLUMN_LABEL: 'Result',           VALUE_TEXT: '-1,234',   VALUE_NUMERIC: -1234,   IS_PLACEHOLDER: false}
          # Embargoed copy, not read: decoys.
          - {ACO_ID: 'TEST-ACO', PERFORMANCE_YEAR: 2000, SUBMISSION_ID: 'STLMT.E', IS_EMBARGOED: true,  FILE_PATH: 'e.xlsx', IS_PREFERRED_SUBMISSION: false, TABLE_CODE: '2', SECTION_CODE: 'I',  ENROLLMENT_TYPE: 'total',    COLUMN_LABEL: 'Performance Year', VALUE_TEXT: '99999',    VALUE_NUMERIC: 99999,   IS_PLACEHOLDER: false}
          - {ACO_ID: 'TEST-ACO', PERFORMANCE_YEAR: 2000, SUBMISSION_ID: 'STLMT.E', IS_EMBARGOED: true,  FILE_PATH: 'e.xlsx', IS_PREFERRED_SUBMISSION: false, TABLE_CODE: '3', SECTION_CODE: 'BB', ENROLLMENT_TYPE: 'total',    COLUMN_LABEL: 'Result',           VALUE_TEXT: '0',        VALUE_NUMERIC: 0,       IS_PLACEHOLDER: false}

    expect:
      rows:
        - {ACO_ID: 'TEST-ACO', PERFORMANCE_YEAR: 2000, SUBMISSION_ID: 'STLMT.U', IS_EMBARGOED: false, SETTLEMENT_DELIVERY_COUNT: 2, UPDATED_BENCHMARK: 1000.50, T2_H_ESRD: 900, T2_H_DISABLED: null, ASSIGNED_BENEFICIARIES: 1000, PERSON_YEARS: null, PERSON_YEARS_DISABLED: 250, SAVINGS_REALIZED: 'N/A', T3_BB: 5432, T3_EE: null, T3_MM: -1234}

  - name: test_settlement_risk_sets_the_two_periods_side_by_side
    model: fct_settlement_risk
    description: >
      Table A1 from the preferred delivery only, by section and type, with
      the BY3 and performance-year cells side by side; a `-` is NULL, and an
      `unmapped` row and the embargoed copy stay out.

    given:

      - input: ref('int_settlement_values')
        rows:
