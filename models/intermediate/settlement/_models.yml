  - name: test_settlement_risk_ratio_reproduces_table_a1
    model: int_settlement_risk_ratio
    description: >
      M-SETTLE against a synthetic Table A1. The inputs are dyadic, so the
      means, weights and ratios are exact; [H] adds the 0.03 cap, and the
      expected 1.155 and 1.03 are the doubles 1.125 + 0.03 and 1.0 + 0.03.
      Every expected [A], [C], [D], [F], [G], [H] and [I] is therefore
      exact, well inside 1e-12.

      2025, the cap does not bind. Aged/non-dual: B1's 12 months (6 at 1.0,
      6 at 1.5) and B2's first 6 (1.25), so [C] 1.25 over 18 months, 1.5
      person years. Aged/dual: B2 retyped by its flag for months 7-12, [C]
      2.0, 0.5 person years. Disabled: B3's 12 months, month 12 unscored, so
      [C] is the mean of 11 scores (1.0) but the person years are 1.0.
      [L] 1000, 1000 and 2000 give weights 0.375, 0.125 and 0.5. ESRD is in
      the workbook with no eligible month: weight 0, no PY score, no ratio,
      and the aggregates still resolve. R = 0.375 x 1.0 + 0.125 x 0.5 + 0.5
      x 1.0 = 0.9375; the weighted [G] is 1.125, so [H] is 1.155. R is
      below [H], so [I] is each type's [D].

      2026, the cap binds. Aged/non-dual and ESRD, one beneficiary each,
      equal weights; [D] 2.0 and 1.0 give R 1.5, above [H] = 1.0 + 0.03, so
      [I] is 1.03 for both.

      2027, a type with person years but no Table 1 [L]: every weight of
      the year is NULL, and so are the aggregates, [H] and [I]; the type's
      own [C] and [D] still resolve. Nothing is defaulted.

      Decoys: the workbook's weighted-average row, and another ACO's
      workbook rows with no settlement population.

    given:

      - input: ref('int_settlement_member_month_risk')
        rows:
          - {ACO_ID: 'A1', PERFORMANCE_YEAR: 2025, BENE_MBI_ID: 'B1', YEAR_MONTH: '202501', ENROLLMENT_TYPE: 'aged_non_dual', RISK_SCORE: 1.0, DEMOGRAPHIC_RISK_SCORE: 1.0}
