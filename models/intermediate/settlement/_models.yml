  - name: test_settlement_member_months_from_the_settlement_aalr
    model: int_settlement_member_month_risk
    description: >
      S1  Latest delivery. Month 1 flag 4, month 2 flag 3, month 3 flag 0:
          two rows, typed `aged_non_dual` then `aged_dual`, each with its own
          month's score and the DEM score of its type. Month 3 is not a
          person-month, so its 9.9 never appears.
      S1  is also in an earlier delivery of the same year, with other flags
          and scores: only the latest delivery is read.
      S3  Latest delivery, not on the Tuva spine, month 1 flag 1 and no
          score: kept, with a NULL person and a NULL score.
      OLD4  A retired MBI the CCLF crosswalk maps to Tuva person P4, month 12.
      Decoy: S9, only in the earlier delivery, has no rows.

    given:

      - input: ref('cms_aalr_connector', 'aalr_settlement_population')
        rows:
          - {aco_id: 'A1', performance_year: '2025', delivery_id: 'P.A1.ACO.AALR.Y2025.D259999.T1111111', is_latest_delivery: true,  bene_mbi_id: 'S1', enrollflag1: 4, enrollflag2: 3, enrollflag3: 0, bene_rsk_r_scre_01: 1.1, bene_rsk_r_scre_02: 1.2, bene_rsk_r_scre_03: 9.9, dem_agnd_score: 0.9, dem_agdu_score: 1.7, dem_esrd_score: 8.8}
          - {aco_id: 'A1', performance_year: '2025', delivery_id: 'P.A1.ACO.AALR.Y2025.D259999.T0000000', is_latest_delivery: false, bene_mbi_id: 'S1', enrollflag1: 1, enrollflag2: 1, bene_rsk_r_scre_01: 7.7, bene_rsk_r_scre_02: 7.7, dem_esrd_score: 7.7}
          - {aco_id: 'A1', performance_year: '2025', delivery_id: 'P.A1.ACO.AALR.Y2025.D259999.T0000000', is_latest_delivery: false, bene_mbi_id: 'S9', enrollflag1: 4, bene_rsk_r_scre_01: 1.0, dem_agnd_score: 1.0}
          - {aco_id: 'A1', performance_year: '2025', delivery_id: 'P.A1.ACO.AALR.Y2025.D259999.T1111111', is_latest_delivery: true,  bene_mbi_id: 'S3', enrollflag1: 1, dem_esrd_score: 1.3}
          - {aco_id: 'A1', performance_year: '2025', delivery_id: 'P.A1.ACO.AALR.Y2025.D259999.T1111111', is_latest_delivery: true,  bene_mbi_id: 'OLD4', enrollflag12: 2, bene_rsk_r_scre_12: 0.8, dem_dis_score: 0.6}

      - input: ref('the_tuva_project', 'core__member_month')
        rows:
          - {person_id: 'S1', member_id: 'S1', year_month: '202501', payer: 'medicare', plan: 'medicare', data_source: 'medicare'}
          - {person_id: 'P4', member_id: 'P4', year_month: '202512', payer: 'medicare', plan: 'medicare', data_source: 'medicare'}

