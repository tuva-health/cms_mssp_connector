version: 2

# Copied from cms_alr_connector mike/tuva-134-disabled-aged-dual-fixtures
# (59045df; v1.1.0 once tagged) integration_tests/seeds/: every CSV
# beside this file unchanged, and these seed configs unchanged apart from
# this comment. They are the synthetic ALR + CCLF fixtures the connector this
# project pins was released with (see integration_tests/README.md). Generated
# outside the repo by cclf-synth, never hand-edited; copy them again when the
# cms_alr_connector pin moves. CI loads these into the raw schema
# (var input_schema) and the connectors read them through source(),
# exactly as they read a client's raw tables: the six ALR tables
# (source cms_ssp_reports) and the CCLF tables of the medicare_cclf_connector
# release this connector pins, v1.0.0 (source medicare_cclf). database/schema are set
# per seed here, not in dbt_project.yml, because project-level configs render
# before the project's own vars are available. Every column is loaded as a
# string, matching how raw CMS files land in a warehouse.
#
# There is no seed for the CCLF `enrollment` source: with cms_alr_connector
# true, medicare_cclf_connector reads this connector's `enrollment` model
# instead, and a seed of that name would capture its ref('enrollment').

seeds:
  # ALR (source cms_ssp_reports)

