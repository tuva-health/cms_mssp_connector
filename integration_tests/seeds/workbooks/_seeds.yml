version: 2

# The twenty BNMRK / AEXPU / QEXPU cell-grain relations of the workbook export
# contract (cms_mssp_pipeline contracts/workbook/v1.json), generated by the
# local-only cclf-synth (`generate-mssp`, TUVA-126). The labels and the cells
# CMS leaves empty or writes '-' in follow the delivered workbooks' grammar as
# the pipeline parses it (a header-only profile: labels and value classes, no
# values); every value is generated and CMS-consistent. ACO A0000, PY2025.
# Regenerate with cclf-synth; never hand-edit.
#
# Column types follow the contract: row_num BIGINT, file_date DATE, every
# other column VARCHAR.

seeds:
