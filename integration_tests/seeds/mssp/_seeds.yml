version: 2

# The other raw MSSP relations (source mssp_raw), header only: no rows. The
# staging models over them are select * or plain casts and nothing downstream
# needs their rows in CI, so these exist to make every source resolve with
# the columns the pipeline actually writes. Each header is the delivered
# file's header (read as the header line only, never a data row) or the
# pipeline's own column list, plus the metadata columns the pipeline appends
# (FILE_PATH, DIRECTORY_NAME, FILE_NAME, FILE_DATE; MCQM also PERIOD). No
# sample file or spec of the participant lists or the shadow bundles is on
# hand, so those carry the metadata columns only. Every column loads as a
# string.
#
# Header sources:
#   baip_beneficiary_advanced_investment_payment: header of the real QBAIP CSV (PY2025 quarterly deliveries); identical to the CMS PY 2026 report template BAIP.csv
#   beneficiary_exclusions: the column list cms_mssp_pipeline bnex_processor.py selects from the BNEX XML
#   beur_beneficiary_expenditure_utilization_report: header of the real QBEUR CSV (PY2025 quarterly deliveries); identical to the CMS PY 2026 report template BEUR.csv
#   excluded_beneficiary_mbi_xref: the fixed-width layout in cms_mssp_pipeline bnex_mbi_xref_file_defs.py
#   mcqm_bcs_112ssp: header row of the real MCQM workbook sheet BCS_112SSP (PY2025 Q1-Q3, union by name)
#   mcqm_beneficiaries: header row of the real MCQM workbook sheet Medicare_CQM_Beneficiaries (PY2025 Q1-Q3, union by name)
#   mcqm_dep_134ssp: header row of the real MCQM workbook sheet DEP_134SSP (PY2025 Q1-Q3, union by name)
#   mcqm_dm_001ssp: header row of the real MCQM workbook sheet DM_001SSP (PY2025 Q1-Q3, union by name)
#   mcqm_htn_236ssp: header row of the real MCQM workbook sheet HTN_236SSP (PY2025 Q1-Q3, union by name)
#   ncbp_non_claims_based_payments: header of the real QNCBP CSV (PY2025 quarterly deliveries)
#   participants_list: metadata columns only (no file or spec on hand)
#   provider_and_supplier_list: metadata columns only (no file or spec on hand)
#   shadow_bundles_dm: metadata columns only (no file or spec on hand)
#   shadow_bundles_epi: metadata columns only (no file or spec on hand)
#   shadow_bundles_hh: metadata columns only (no file or spec on hand)
#   shadow_bundles_hs: metadata columns only (no file or spec on hand)
#   shadow_bundles_ip: metadata columns only (no file or spec on hand)
#   shadow_bundles_opl: metadata columns only (no file or spec on hand)
#   shadow_bundles_pb: metadata columns only (no file or spec on hand)
#   shadow_bundles_sn: metadata columns only (no file or spec on hand)

