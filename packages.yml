packages:
  - package: dbt-labs/dbt_utils
    version: [">=0.9.2"]
  # cms_alr_connector v1.0.0 brings medicare_cclf_connector v1.0.0 and Tuva
  # Core v1.0.0 (tuva-health/tuva-core, dbt package name the_tuva_project)
  # transitively. Every pin below is a release tag; bump them deliberately and
  # together.
  - git: "https://github.com/tuva-health/cms_alr_connector.git"
    revision: "v1.0.0"
  # The Tuva semantic layer is a separate package in Tuva 1.0 (dbt package
  # name semantic_layer). fact_member_month_benchmark reads its
  # semantic_layer__fact_member_months. Its README asks the root project to
  # declare Tuva Core and the five marts it builds on, at the same tag.
  - git: "https://github.com/tuva-health/tuva-core.git"
    revision: "v1.0.0"
  - git: "https://github.com/tuva-health/ahrq_quality_indicators.git"
    revision: "v1.0.0"
  - git: "https://github.com/tuva-health/ccsr.git"
    revision: "v1.0.0"
  - git: "https://github.com/tuva-health/cms_hcc.git"
    revision: "v1.0.0"
  - git: "https://github.com/tuva-health/nyu_ed_classification.git"
    revision: "v1.0.0"
  - git: "https://github.com/tuva-health/quality_measures.git"
    revision: "v1.0.0"
  - git: "https://github.com/tuva-health/semantic-layer.git"
    revision: "v1.0.0"
  # CMS chronic conditions (dbt package name cms_chronic_conditions) replaces
  # the Tuva-defined chronic conditions retired in 1.0, which semantic layer
  # 1.0 dropped with dim_condition and fact_member_condition_bridge. It reads
  # Tuva Core only. tuva-health/chronic_conditions is a GitHub redirect to
  # this repo; pin the canonical name.
  - git: "https://github.com/tuva-health/cms_chronic_conditions.git"
    revision: "v1.0.0"
