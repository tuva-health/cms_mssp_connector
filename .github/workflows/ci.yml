# PR gate for the canonical connector. Everything here runs without warehouse
# access or secrets: the Snowflake profile is a placeholder rendered from
# config/profiles.example.yml, `dbt parse` never opens a connection, the image
# is built but not pushed, and `dbt build / duckdb` builds the integration_tests
# project on a local DuckDB file from synthetic fixture seeds.
#
# The six job names are the checks to require on `main`; keep them stable.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR pushes are cancelled; every push to main runs to completion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Same uv release as the Dockerfile's uv stage; tests/test_release_contract.py
  # asserts the two agree.
  UV_VERSION: "0.10.9"

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen
      - run: uv run --frozen python -m unittest discover -s tests

  lock:
    name: lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv lock --check

  # The Dockerfile parses and verifies both targets too; this job is the fast
  # signal that does not wait for an image build, and it fixes the placement
  # database per target so the verifier checks each manifest against it.
  dbt-parse:
    name: dbt-parse
    runs-on: ubuntu-latest
    env:
      DBT_PROFILES_DIR: config
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
      # Neutral placement databases; the same values the contract tests use.
      DEV_DATABASE: ANALYTICS_DEV
      PROD_DATABASE: ANALYTICS_PROD
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen
      - name: Render a placeholder profile from the example
        # config/profiles.yml is git-ignored; it exists only on this runner.
        run: scripts/render_placeholder_profile.sh > config/profiles.yml
      - run: uv run --frozen dbt deps
      - name: Parse and verify the dev manifest
        env:
          SNOWFLAKE_DATABASE: ${{ env.DEV_DATABASE }}
        run: |
          uv run --frozen dbt parse --target dev
          uv run --frozen python scripts/verify_manifest.py \
            --manifest target/manifest.json \
            --package-lock package-lock.yml \
            --database "$DEV_DATABASE"
      - name: Parse and verify the prod manifest
        env:
          SNOWFLAKE_DATABASE: ${{ env.PROD_DATABASE }}
        run: |
          uv run --frozen dbt parse --target prod --target-path target/prod
          uv run --frozen python scripts/verify_manifest.py \
            --manifest target/prod/manifest.json \
            --package-lock package-lock.yml \
            --database "$PROD_DATABASE"

  shell:
    name: shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
      - run: uvx --from shellcheck-py==0.11.0.1 shellcheck scripts/*.sh

  image:
    name: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Render a placeholder profile from the example
        # The Dockerfile copies config/profiles.yml into the image and parses
        # with it, so the build context needs one.
        run: scripts/render_placeholder_profile.sh > config/profiles.yml
      - name: Build the release image without pushing
        # Same build arguments as scripts/build_release_image.sh. SOURCE_COMMIT
        # is the checked-out commit (on a pull request, the merge commit that is
        # being tested); the release ID is a CI marker, never a real release.
        run: |
          docker build \
            --platform linux/amd64 \
            --build-arg "SOURCE_COMMIT=$(git rev-parse HEAD)" \
            --build-arg "RELEASE_ID=ci-${GITHUB_RUN_ID}" \
            --tag cms-mssp-connector:ci \
            .

  # Builds the connector and everything under it (cms_alr_connector,
  # medicare_cclf_connector, Tuva Core and the semantic-layer stack) from the
  # synthetic seeds in integration_tests/, the same steps as scripts/dbt-local
  # (see integration_tests/README.md). No secrets. The check name matches the
  # cms_alr_connector and medicare_cclf_connector DuckDB jobs.
  duckdb:
    name: dbt build / duckdb
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DBT_PROJECT_DIR: integration_tests
      DBT_PROFILES_DIR: integration_tests/profiles/local_duckdb
      DBT_DUCKDB_PATH: ${{ github.workspace }}/cms_mssp_connector_ci.duckdb
      # The extensions are installed below; a missing one fails the build
      # instead of downloading in the middle of it.
      DBT_DUCKDB_AUTOINSTALL_EXTENSIONS: "false"
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
      # The profile attaches the file as catalog cms_mssp_connector_ci,
      # whatever its name; fixture seeds load into it and every source()
      # reads them back.
      CI_DBT_VARS: '{"input_database": "cms_mssp_connector_ci", "input_schema": "raw"}'
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - name: Read the DuckDB version
        id: duckdb
        shell: bash
        run: |
          version="$(uv run --frozen python -c 'import duckdb; print(duckdb.__version__)')"
          test -n "$version" || { echo "Could not read the DuckDB version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # DuckDB keeps extensions under ~/.duckdb/extensions/v<version>/<platform>,
      # so a DuckDB bump starts a fresh cache.
      - name: Cache DuckDB extensions
        uses: actions/cache@v6
        with:
          path: ~/.duckdb/extensions
          key: duckdb-extensions-${{ runner.os }}-${{ runner.arch }}-${{ steps.duckdb.outputs.version }}-httpfs
      # Tuva Core reads its terminology seeds from S3, which needs httpfs, the
      # only extension the build loads that the duckdb wheel does not link in.
      # INSTALL is a no-op when the cache restored it; on a miss the download
      # is retried here, before any dbt step runs.
      - name: Install DuckDB extensions
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if uv run --frozen python -c "import duckdb; duckdb.sql('INSTALL httpfs; LOAD httpfs')"; then
              exit 0
            fi
            echo "httpfs install attempt ${attempt} failed" >&2
            sleep $((attempt * 10))
          done
          exit 1
      - name: Install dbt packages
        run: uv run --frozen dbt deps --project-dir "$DBT_PROJECT_DIR"
      - name: Parse project
        run: uv run --frozen dbt parse --project-dir "$DBT_PROJECT_DIR" --vars "$CI_DBT_VARS"
      # Before the build: the connectors' staging views read the seeded
      # tables, and DuckDB binds a view's tables when it is created.
      - name: Load fixture seeds
        run: >-
          uv run --frozen dbt seed --full-refresh --project-dir "$DBT_PROJECT_DIR" --vars "$CI_DBT_VARS"
          --select package:integration_tests
      # Unit tests run inside the build, after their mocked parents exist:
      # dbt reads a mocked relation's columns from the warehouse.
      - name: Build
        run: >-
          uv run --frozen dbt build --full-refresh --project-dir "$DBT_PROJECT_DIR" --vars "$CI_DBT_VARS"
          --exclude package:integration_tests,resource_type:seed
