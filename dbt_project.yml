
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'cms_mssp_connector'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
# The runtime resolves this profile from an operator-provided config/profiles.yml
# overlay (git-ignored); see config/profiles.example.yml for the env-var contract.
profile: 'cms_mssp_connector'

vars:
  input_database: tuva
  input_schema: raw_data

  demo_data_only: false
  claims_enabled: true
  cms_alr_connector: true
  provider_attribution_enabled: true
  semantic_layer_enabled: true

  # Cap on the ACO's aggregate PY-to-BY3 prospective HCC risk ratio applied
  # by fact_benchmark_aco_quarter: 0.03 is the 3 percentage points of
  # 42 CFR 425.605(a)(1)(ii)(A). Swap in a published factor by overriding it.
  mssp_risk_score_cap: 0.03

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
   cms_mssp_connector:
     final:
       +materialized: table
     intermediate:
       +materialized: table
     staging:
       +materialized: view
