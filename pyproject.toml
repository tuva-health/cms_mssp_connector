[project]
name = "cms-mssp_connector"
version = "0.3.0"
description = "Portable dbt connector for CMS MSSP source data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dbt-core==1.11.14",
    "dbt-duckdb==1.10.1",
    "duckdb==1.4.3",
    "dbt-snowflake==1.10.7",
    "sqlparse>=0.6.0",
    "urllib3>=2.5.0",
]

[dependency-groups]
dev = []

[tool.cms_mssp_connector]
# The workbook export contract (cms_mssp_pipeline contracts/workbook/v1.json)
# whose twenty cell-grain relations the benchmark models read. Every GitHub
# Release names it; bump it together with the models when the contract changes.
workbook_contract = { contract = "cms-mssp-workbook-export", version = "1.0.0" }
